  /v1/offers/images:
    post:
      tags: [Pictures]
      summary: Upload a picture
      description: |
        The body is the picture itself — a JPEG or a PNG, up to 4 MiB. It is
        stored as sent, minus its metadata (EXIF, including GPS and
        orientation, XMP, comments).

        There is no confirm step: sending the returned `image_url` in
        `images[]` on create or patch is what attaches it.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |
            curl --request POST \
              --url https://api.moonup.gg/v1/offers/images \
              --header 'Authorization: Bearer <token>' \
              --header 'Content-Type: image/png' \
              --data-binary @cover.png
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            Too many pictures are being processed at once and this one could
            not start within 10 seconds. Nothing was stored; send it again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unavailable:
                  value: { error: unavailable }

components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
      description: Your API key, from the cabinet under **Seller → API keys**.

  parameters:
    Game:
      name: game
      in: path
      required: true
      description: The game's `slug`, or its id — both are accepted.
      schema: { type: string, examples: [roblox] }
    CategorySlug:
      name: category_slug
      in: path
      required: true
      schema: { type: string, examples: [accounts] }
    OfferID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size. Absent or 0 returns everything.
      schema: { type: integer, minimum: 0 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }

  responses:
    BadRequest:
      description: |
        The body or a parameter is wrong. `error` names which rule — e.g.
        `delivery_instructions_required`, `bulk_fields_required`,
        `instant_requires_activation_code`, `title_too_short`,
        `invalid_attributes`, `invalid_image`, `invalid_tags`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missing_field:
              value: { error: delivery_instructions_required }
    Unauthorized:
      description: |
        The key is unknown, revoked, or the request came from an address
        outside the key's list. Which check failed is not disclosed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unauthorized:
              value: { error: unauthorized }
    Forbidden:
      description: |
        The key is valid but the account may not do this — it lacks the
        permission, or it is suspended (`account_suspended`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing — or none you may know about, which answers the same on purpose.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            not_found:
              value: { error: not_found }
    Conflict:
      description: |
        The request was well formed, the offer is just not where it would have
        to be — `invalid_transition`, `offer_locked`, `sold_out`,
        `seller_on_vacation`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: One of the budgets is spent. Wait and retry; the key stays valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            rate_limited:
              value: { error: rate_limited }

  schemas:
    Error:
      type: object
      description: The one failure shape this API answers with.
      properties:
        error:
          type: string
          description: A stable snake_case code. Branch on this.
          examples: [delivery_instructions_required]
      required: [error]

    Game:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, examples: [roblox] }
        name: { type: string }
        icon_url: { type: [string, "null"], format: uri }
        hero_url: { type: [string, "null"], format: uri }
        pack_icon_url: { type: [string, "null"], format: uri }
        offer_count:
          type: integer
          format: int64
          description: |
            Active listings, narrowed to the `category` this list was asked
            for. Counts what a buyer could actually buy: out of stock, and
            sellers away, are left out.
        created_at: { type: [string, "null"], format: date-time }

    GameCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        game_category_id:
          type: string
          format: uuid
          description: This game/category pair's own id.
        slug: { type: string, examples: [accounts] }
        name: { type: string }
        icon_url: { type: [string, "null"], format: uri }
        hero_url: { type: [string, "null"], format: uri }
        pack_icon_url: { type: [string, "null"], format: uri }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        game_category_id: { type: string, format: uuid }
        slug: { type: string, description: What `product_slug` names. }
        name: { type: string }
        icon_url: { type: [string, "null"], format: uri }
        scale:
          type: string
          enum: [unit, thousand, million]
          description: |
            The unit `price_per_unit` and `stock_quantity` are counted in for
            this product. A price is per one of these, not per coin.
        created_at: { type: [string, "null"], format: date-time }

    CatalogItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: What a `reference` attribute carries as its value.
        name: { type: string }
        image_url: { type: [string, "null"], format: uri }

    DeliveryMethod:
      type: object
      properties:
        key: { type: string, examples: [activation_code] }
        label: { type: string }
        description: { type: string }
        version: { type: integer, description: "Bumped when `buyer_fields` change; a listing keeps the version it was created under." }
        buyer_fields:
          type: array
          description: What the buyer is asked for at checkout. You collect nothing yourself.
          items: { $ref: "#/components/schemas/SchemaField" }

    SchemaField:
      type: object
      description: One field of a category's attribute schema.
      properties:
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [string, number, boolean, enum, reference, password]
        required: { type: boolean }
        filterable:
          type: boolean
          description: The storefront offers this field as a filter.
        multiple:
          type: boolean
          description: The value is then an array of what `type` describes.
        enum_values:
          type: array
          items: { type: string }
          description: Allowed values, for `enum`.
        catalog_key:
          type: string
          description: |
            For `reference` — which catalog to read the allowed ids from, at
            `GET /v1/offers/games/{game_id}/catalog/{attribute_key}`. Equal to
            `key` when absent.
        min: { type: number, description: "For `number` — the smallest value accepted." }
        max: { type: number, description: "For `number` — the largest." }
      required: [key, label, type, required, filterable]

    CategorySchema:
      type: object
      description: A category's fields, and what its create call demands.
      properties:
        id: { type: string, format: uuid }
        game_category_id: { type: string, format: uuid }
        version:
          type: integer
          description: The schema version a listing created now is pinned to.
        attributes:
          type: array
          items: { $ref: "#/components/schemas/SchemaField" }
        created_at: { type: [string, "null"], format: date-time }

    OfferBase:
      type: object
      description: What every category's listing carries, whatever it sells.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        attributes:
          type: object
          description: The category's own fields, keyed by the schema's `key`.
          additionalProperties: true
        tags:
          type: array
          items: { type: string }
        status:
          type: string
          description: |
            `draft` on create, then `active` once you publish it; unpublish
            takes it back to `draft`. `archived` is yours too, through `DELETE`. `sold`
            follows an order: the last unit went to a closed one.
          enum: [draft, active, sold, archived]
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        published_at:
          type: [string, "null"]
          format: date-time
          description: |
            When `publish` put it on the marketplace. `null` while it is a
            draft, and written once — pausing and unpausing leave it alone.

    FiledUnder:
      type: object
      description: Which game a listing is under. The category is the path.
      properties:
        game_id: { type: string, format: uuid }
        game_slug: { type: string }

    Pool:
      type: object
      description: The stock of a listing that sells out of encrypted units.
      properties:
        available_units: { type: integer, format: int64, description: Units neither reserved nor sold. }
        units:
          type: array
          description: Your own pool — id and status per unit, never the goods.
          items: { $ref: "#/components/schemas/Unit" }

    Unit:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [available, reserved, sold, revoked]
          description: |
            `available` until an order takes it. `revoked` is a unit whose
            goods reached the buyer and were then refunded — it is wiped, and
            never sells again.

    RowBase:
      type: object
      description: What every category's list row carries.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, description: The same values an offer's own `status` takes. }
        updated_at: { type: [string, "null"], format: date-time }
        game_name: { type: string }
        game_slug: { type: string }
        game_icon_url: { type: [string, "null"], format: uri }

    Delivery:
      type: object
      description: How a listing sold by hand promises to hand over.
      properties:
        manual_delivery_value:
          type: [integer, "null"]
          format: int32
          description: The handover time promised, read together with the unit — `2` and `hours`.
        manual_delivery_unit:
          type: [string, "null"]
          enum: [minutes, hours, days, null]
          description: What the value counts. Both are `null` on a listing delivered instantly.

    FixedPriceCreate:
      type: object
      required: [game, title, price, delivery_type]
      properties:
        game: { type: string, description: The game's slug. }
        title: { type: string, minLength: 8, maxLength: 128 }
        description: { type: string, maxLength: 4096 }
        price:
          type: integer
          format: int64
          description: US cents — `4990` is $49.90. USD is the only currency the platform prices in.
        images:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri }
          description: |
            `image_url`s returned by `POST /v1/offers/images`. At
            least one: it is the cover the marketplace renders. A URL from
            anywhere else is refused (`invalid_image`).
        tags:
          type: array
          items: { type: string }
          description: Up to 500 characters in all, counted as the tags joined with ", ". No commas inside a tag. Stored trimmed, lower-cased and deduplicated.
        attributes:
          type: object
          description: The category's own fields — read them from its schema.
          additionalProperties: true
        delivery_type:
          type: string
          enum: [instant, manual]
          description: |
            `instant` hands a unit from the pool over the moment an order is
            paid. `manual` is you handing over yourself, within the time below.
        units:
          type: array
          description: |
            `delivery_type: instant` only — one opaque JSON payload per unit,
            the goods themselves. Encrypted at rest; never read back.
          items: { type: object }
        manual_delivery_value:
          type: integer
          format: int32
          description: "`delivery_type: manual` only — the handover time you promise."
        manual_delivery_unit:
          type: string
          enum: [minutes, hours, days]
          description: What `manual_delivery_value` counts.

    FixedPriceUpdate:
      type: object
      description: Every field optional; absent means "leave unchanged".
      properties:
        title: { type: string, minLength: 8, maxLength: 128 }
        description: { type: string, maxLength: 4096 }
        price: { type: integer, format: int64, description: US cents. }
        images:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          description: Replaces the whole gallery.
        tags:
          type: array
          items: { type: string }
          description: Replaces the whole list. Same limits as on create.
        attributes:
          type: object
          additionalProperties: true
          description: |
            Replaces the whole map — send every field the category asks for,
            not only the one that changed.
        delivery_type:
          type: string
          enum: [instant, manual]
          description: Changing it replaces the listing's unit pool.
        units:
          type: array
          items: { type: object }
          description: |
            Read only when `delivery_type` switches to `instant`, as the pool
            the listing starts over with. Ignored otherwise: stock is added
            through `POST .../units`.
        manual_delivery_value: { type: integer, format: int32, description: The handover time you promise. }
        manual_delivery_unit: { type: string, enum: [minutes, hours, days], description: What the value counts. }

    FixedPriceOffer:
      allOf:
        - { $ref: "#/components/schemas/OfferBase" }
        - { $ref: "#/components/schemas/Delivery" }
        - type: object
          properties:
            price: { type: integer, format: int64, description: US cents. }
            currency: { type: string, examples: [USD], description: Always `USD`. }
            images:
              type: array
              items: { type: string, format: uri }
            delivery_type:
              type: string
              enum: [instant, manual]
              description: "`instant` sells out of the unit pool; `manual` you hand over yourself."

    FixedPriceOfferDetail:
      allOf:
        - { $ref: "#/components/schemas/FixedPriceOffer" }
        - { $ref: "#/components/schemas/FiledUnder" }
        - { $ref: "#/components/schemas/Pool" }

    FixedPriceRow:
      allOf:
        - { $ref: "#/components/schemas/RowBase" }
        - type: object
          properties:
            price: { type: integer, format: int64, description: US cents. }
            currency: { type: string, description: Always `USD`. }
            images:
              type: array
              items: { type: string, format: uri }
            delivery_type:
              type: string
              enum: [instant, manual]
              description: "`instant` sells out of the unit pool; `manual` you hand over yourself."
            stock: { type: integer, description: Units still available. }

    TopUpCreate:
      allOf:
        - { $ref: "#/components/schemas/FixedPriceCreate" }
        - type: object
          required: [delivery_method, delivery_instructions]
          properties:
            delivery_method:
              type: string
              description: |
                A key from `GET /v1/offers/delivery-methods`. Instant delivery
                is only possible with `activation_code`.
            delivery_instructions:
              type: string
              maxLength: 2048
              description: What the buyer is told to do at handover, in your words.
      description: |
        A top-up's pictures are optional — the marketplace renders the pack
        tile, not an offer gallery.

    TopUpUpdate:
      allOf:
        - { $ref: "#/components/schemas/FixedPriceUpdate" }
        - type: object
          properties:
            delivery_method: { type: string, description: A key from `GET /v1/offers/delivery-methods`. }
            delivery_instructions: { type: string, maxLength: 2048, description: What the buyer is told to do at handover. }

    TopUpOffer:
      allOf:
        - { $ref: "#/components/schemas/FixedPriceOffer" }
        - type: object
          properties:
            delivery_method: { type: [string, "null"], description: The key this listing hands over by. }
            delivery_instructions: { type: string, description: What the buyer is told to do at handover. }

    TopUpOfferDetail:
      allOf:
        - { $ref: "#/components/schemas/TopUpOffer" }
        - { $ref: "#/components/schemas/FiledUnder" }
        - { $ref: "#/components/schemas/Pool" }

    TopUpRow:
      allOf:
        - { $ref: "#/components/schemas/FixedPriceRow" }
        - type: object
          properties:
            delivery_method: { type: [string, "null"], description: The key this listing hands over by. }

    GiftCardCreate:
      type: object
      description: |
        A gift card is one redemption code, handed over instantly — there is
        no delivery type to pick and no handover time to promise.
      required: [game, title, price, delivery_method, units]
      properties:
        game: { type: string, description: The game's slug. }
        title: { type: string, minLength: 8, maxLength: 128 }
        description: { type: string, maxLength: 4096 }
        price: { type: integer, format: int64, description: US cents. }
        images:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          description: Optional — the marketplace renders the pack tile.
        tags:
          type: array
          items: { type: string }
          description: Up to 500 characters in all, counted as the tags joined with ", ". No commas inside a tag. Stored trimmed, lower-cased and deduplicated.
        attributes:
          type: object
          additionalProperties: true
          description: The category's own fields — read them from its schema.
        delivery_method:
          type: string
          description: A key from `GET /v1/offers/delivery-methods` — `activation_code`.
        units:
          type: array
          minItems: 1
          description: The codes themselves, one opaque JSON payload each. Encrypted at rest; never read back.
          items: { type: object }

    GiftCardUpdate:
      type: object
      description: Every field optional; absent means "leave unchanged".
      properties:
        title: { type: string, minLength: 8, maxLength: 128 }
        description: { type: string, maxLength: 4096 }
        price: { type: integer, format: int64, description: US cents. }
        images:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          description: Replaces the whole gallery.
        tags:
          type: array
          items: { type: string }
          description: Replaces the whole list. Same limits as on create.
        attributes:
          type: object
          additionalProperties: true
          description: Replaces the whole map — send every field, not only the changed one.
        delivery_method: { type: string, description: A key from `GET /v1/offers/delivery-methods` — `activation_code`. }

    GiftCardOffer:
      allOf:
        - { $ref: "#/components/schemas/OfferBase" }
        - type: object
          properties:
            price: { type: integer, format: int64, description: US cents. }
            currency: { type: string, examples: [USD], description: Always `USD`. }
            images:
              type: array
              items: { type: string, format: uri }
            delivery_method: { type: [string, "null"], description: The key this listing hands over by. }

    GiftCardOfferDetail:
      allOf:
        - { $ref: "#/components/schemas/GiftCardOffer" }
        - { $ref: "#/components/schemas/FiledUnder" }
        - { $ref: "#/components/schemas/Pool" }

    GiftCardRow:
      allOf:
        - { $ref: "#/components/schemas/RowBase" }
        - type: object
          properties:
            price: { type: integer, format: int64, description: US cents. }
            currency: { type: string, description: Always `USD`. }
            images:
              type: array
              items: { type: string, format: uri }
            delivery_method: { type: [string, "null"], description: The key this listing hands over by. }
            stock: { type: integer, description: Codes still available. }

    CurrencyCreate:
      type: object
      description: |
        Currency is priced per unit out of a stock you keep, and handed over by
        hand — there is no listing price, no unit pool and no gallery. The
        three quantities are counted in the product's own `scale`: for a
        product sold by the million, `stock_quantity: 500` is 500 million.
      required:
        [game, title, product_slug, price_per_unit, stock_quantity, min_order_quantity,
         delivery_method, delivery_instructions, manual_delivery_value, manual_delivery_unit]
      properties:
        game: { type: string, description: The game's slug. }
        title: { type: string, minLength: 8, maxLength: 128 }
        description: { type: string, maxLength: 4096 }
        tags:
          type: array
          items: { type: string }
          description: Up to 500 characters in all, counted as the tags joined with ", ". No commas inside a tag. Stored trimmed, lower-cased and deduplicated.
        attributes:
          type: object
          additionalProperties: true
          description: The category's own fields — read them from its schema.
        product_slug:
          type: string
          description: One of the game category's products — `GET .../products`.
        price_per_unit: { type: integer, format: int64, description: US cents per one of the product's `scale`. }
        stock_quantity: { type: integer, format: int64, description: "How much you have, counted in the product's `scale`." }
        min_order_quantity: { type: integer, format: int64, description: The smallest order you will take. }
        delivery_method: { type: string, description: A key from `GET /v1/offers/delivery-methods`. }
        delivery_instructions: { type: string, maxLength: 2048, description: "What the buyer is told to do at handover, in your words." }
        manual_delivery_value: { type: integer, format: int32, description: The handover time you promise. }
        manual_delivery_unit: { type: string, enum: [minutes, hours, days], description: What the value counts. }

    CurrencyUpdate:
      type: object
      description: |
        Every field optional; absent means "leave unchanged". Repricing and
        restocking here are ordinary edits.
      properties:
        title: { type: string, minLength: 8, maxLength: 128 }
        description: { type: string, maxLength: 4096 }
        tags:
          type: array
          items: { type: string }
          description: Replaces the whole list. Same limits as on create.
        attributes:
          type: object
          additionalProperties: true
          description: Replaces the whole map — send every field, not only the changed one.
        price_per_unit: { type: integer, format: int64, description: US cents per one of the product's `scale`. }
        stock_quantity: { type: integer, format: int64, description: "What you have left, in the product's `scale` — restocking is this field." }
        min_order_quantity: { type: integer, format: int64, description: The smallest order you will take. }
        delivery_method: { type: string, description: A key from `GET /v1/offers/delivery-methods`. }
        delivery_instructions: { type: string, maxLength: 2048, description: What the buyer is told to do at handover. }
        manual_delivery_value: { type: integer, format: int32, description: The handover time you promise. }
        manual_delivery_unit: { type: string, enum: [minutes, hours, days], description: What the value counts. }

    CurrencyOffer:
      allOf:
        - { $ref: "#/components/schemas/OfferBase" }
        - { $ref: "#/components/schemas/Delivery" }
        - type: object
          properties:
            currency: { type: string, examples: [USD], description: Always `USD`. }
            product_id: { type: [string, "null"], format: uuid, description: "The product this listing sells, from `GET .../products`." }
            price_per_unit: { type: [integer, "null"], format: int64, description: US cents per one of the product's scale. }
            stock_quantity: { type: [integer, "null"], format: int64, description: "What is left, in that same scale." }
            min_order_quantity: { type: [integer, "null"], format: int64, description: The smallest order this listing takes. }
            delivery_method: { type: [string, "null"], description: The key this listing hands over by. }
            delivery_instructions: { type: string, description: What the buyer is told to do at handover. }

    CurrencyOfferDetail:
      allOf:
        - { $ref: "#/components/schemas/CurrencyOffer" }
        - { $ref: "#/components/schemas/FiledUnder" }
        - type: object
          properties:
            product_scale:
              type: [string, "null"]
              description: What one unit means — `unit`, `thousand` or `million`.

    CurrencyRow:
      allOf:
        - { $ref: "#/components/schemas/RowBase" }
        - type: object
          properties:
            currency: { type: string, description: Always `USD`. }
            price_per_unit: { type: [integer, "null"], format: int64, description: US cents per one of the product's scale. }
            stock_quantity: { type: [integer, "null"], format: int64, description: "What is left, in that same scale." }
            product_scale: { type: [string, "null"], description: "What one unit means — `unit`, `thousand` or `million`." }
            delivery_method: { type: [string, "null"], description: The key this listing hands over by. }
