    get:
      tags: [Gift cards]
      operationId: listGiftCardOffers_gift_card
      summary: List your gift-card listings
      description: |
        Yours in this category, in any status. The seller is the key's own
        account — there is no parameter to read someone else's.
      parameters:
        - name: status
          in: query
          description: Comma-separated. A status nothing matches is an empty list, not an error.
          schema: { type: string, examples: ["active,draft"] }
        - name: game
          in: query
          description: Narrow to one game, by slug.
          schema: { type: string }
        - name: q
          in: query
          description: Narrow by title.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
