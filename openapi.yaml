      summary: Unpublish one of your gift-card listings
      description: Back to `draft`. Buyers stop seeing the listing; `publish` puts it back.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
