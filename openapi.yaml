openapi: 3.1.0

info:
  title: MoonUP Seller API
  version: "1.0.0"
  summary: List and manage your offers from your own tools.
  description: |
    Everything a seller's bot needs to keep a catalogue of listings up to date:
    create a listing, restock it, unpublish it, archive it.

    Each category has its own paths — `/v1/offers/accounts`,
    `/v1/offers/currency` and so on — with its own fields. You integrate with
    the categories you sell in, and a category added to the platform later
    leaves yours untouched.

    This is the public surface. The cabinet's own screens — payouts, disputes,
    account settings — are not part of it and an API key does not reach them.

    ## Authentication

    Create a key in the cabinet under **Seller → API keys**. It is shown once.
    Send it on every request:

    ```
    Authorization: Bearer moonup_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    ```

    There is nothing to exchange it for — no short-lived token sits in between.
    HTTPS only. Keep the key in an environment variable or your CI's secret
    store, never in a repository.

    A key may be pinned to a list of addresses when you create it (up to 16
    addresses or subnets). An empty list means any address.

    ## Creating a listing

    Categories do not sell the same thing, so they do not ask for the same
    fields, and each one's create call takes only its own. An accounts listing
    has a price and a picture; a currency listing has a product, a price per
    unit and a stock, and no picture at all; a gift card is a code, so it has
    no manual handover time to promise.

    What every category does share is `attributes` — its own field list, which
    varies by game and is versioned. That one you read at runtime:

        GET /v1/offers/games/{game}/categories/{category_slug}/schema

    A full pass looks like this:

    1. `GET /v1/offers/games` — pick a game, keep its `slug`.
    2. `GET /v1/offers/games/{game}/categories` — pick a category.
    3. `GET /v1/offers/games/{game}/categories/{category_slug}/schema` — read
       `attributes`.
    4. `POST /v1/offers/images` with the picture as the body. Repeat per
       picture, collect the `image_url`s. Skip it for a category with no
       gallery.
    5. `POST /v1/offers/{category}` — the listing is created as a `draft`.
    6. `POST /v1/offers/{category}/{id}/publish` — it goes on the marketplace.

    ## Statuses

    A new listing is a `draft`: yours, and nobody else's to see. `publish`
    makes it `active`, and buyers can buy it from that moment — nothing reviews
    it first. Editing changes nothing about where a listing stands: an `active`
    one stays live, a `draft` stays a draft.

    `unpublish` takes an `active` listing back to `draft`. `archived` is the end of
    the line: `DELETE` retires a listing for good and keeps it readable to you.
    `sold` follows orders, not calls: the last unit went to a closed order. A
    listing whose stock is all in open orders stays `active`, and a cancelled
    order puts the stock back. A listing moderation removes for breaking the
    rules is deleted outright: every call on it answers `404`.

    ## Rate limits

    | | Budget |
    |---|---|
    | Reads | 500 requests per minute |
    | Writes | 250 requests per minute |
    | Writes to one offer | 5 per minute and 10 per hour |

    Going over answers `429`. It is temporary: wait and retry, the key stays
    valid. Up to 5 keys per account — create the second one ahead of time so
    you can rotate without downtime.

    ## Errors

    Every failure answers with the same body, a stable snake_case code:

    ```json
    { "error": "delivery_instructions_required" }
    ```

    Branch on `error`, not on the message — there is no message.

servers:
  - url: https://api.moonup.gg
    description: Production

security:
  - api_key: []

tags:
  - name: Catalog
    description: |
      What can be listed, and what each category's fields are. Public: these
      read without a key, so you can explore before you have one.
  - name: Accounts
    description: Game accounts, sold whole — one price, one picture.
  - name: Top-ups
    description: Top-up packs, handed over by one of the platform's delivery methods.
  - name: Gift cards
    description: Fixed-denomination codes, handed over instantly.
  - name: Currency
    description: In-game currency, priced per unit out of a stock you keep.
  - name: Pictures
    description: Where an offer's images come from.

paths:
  /v1/offers/games:
    get:
      tags: [Catalog]
      summary: List games
      description: Every game with listings open. `slug` is what the rest of the API names a game by.
      security: []
      parameters:
        - name: category
          in: query
          description: Only games with this category open.
          schema: { type: string, examples: [accounts] }
        - name: q
          in: query
          description: Narrow by name.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items: { $ref: "#/components/schemas/Game" }
                  total: { type: integer, format: int64 }

  /v1/offers/games/{game}/categories:
    get:
      tags: [Catalog]
      summary: List a game's categories
      security: []
      parameters:
        - { $ref: "#/components/parameters/Game" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/GameCategory" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/offers/games/{game}/categories/{category_slug}/schema:
    get:
      tags: [Catalog]
      summary: What this category needs
      description: |
        The one call to make before building a create body: `attributes[]` is
        the category's field list, and `version` is what a listing created now
        is pinned to. What else a body must carry is the category's own create
        page — each category takes only its own fields.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Game" }
        - { $ref: "#/components/parameters/CategorySlug" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySchema" }
              examples:
                accounts:
                  summary: An accounts category — a picture, a price, either delivery
                  value:
                    id: 018f2c1e-0000-7000-8000-000000000001
                    game_category_id: 018f2c1e-0000-7000-8000-000000000002
                    version: 1
                    attributes:
                      - key: more_played_game
                        label: Most Played Game
                        type: enum
                        required: true
                        filterable: true
                        enum_values: ["Blox Fruits", "Adopt Me!"]
                      - key: robux_balance
                        label: Robux Balance
                        type: number
                        required: false
                        filterable: false
                        min: 0
                currency:
                  summary: A currency category — priced per unit out of a stock, manual only
                  value:
                    id: 018f2c1e-0000-7000-8000-000000000003
                    game_category_id: 018f2c1e-0000-7000-8000-000000000004
                    version: 2
                    attributes: []
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/offers/games/{game}/categories/{category_slug}/products:
    get:
      tags: [Catalog]
      summary: List a category's products
      description: |
        The curated products a bulk (currency) listing may sell. `slug` is what
        `product_slug` names. Empty for categories that are not priced per unit.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Game" }
        - { $ref: "#/components/parameters/CategorySlug" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/offers/games/{game_id}/catalog/{attribute_key}:
    get:
      tags: [Catalog]
      summary: List a reference field's values
      description: |
        The allowed values of one `reference` attribute — a game's skins, maps
        or ranks. An offer's `attributes` carries the `id` of the chosen row.
        Only for fields whose `type` is `reference`; `enum` fields carry their
        values inline in the schema.
      security: []
      parameters:
        - name: game_id
          in: path
          required: true
          description: The game's id, as `GET /v1/offers/games` returns it.
          schema: { type: string, format: uuid }
        - name: attribute_key
          in: path
          required: true
          description: The schema field's `catalog_key`, or its `key` when it has none.
          schema: { type: string, examples: [skin] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogItem" }

  /v1/offers/delivery-methods:
    get:
      tags: [Catalog]
      summary: List delivery methods
      description: |
        The global list a listing's `delivery_method` is picked from. A
        category narrows it: a top-up or a gift card delivered instantly takes
        `activation_code` and nothing else, and a category whose create body
        has no `delivery_method` at all picks none.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_methods:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveryMethod" }

  /v1/offers/accounts:
    post:
      tags: [Accounts]
      operationId: createFixedPriceOffer_accounts
      summary: Create a game account listing
      description: |
        Created as a `draft` — nobody but you can see it until you publish it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixedPriceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedPriceOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/offers/accounts/my:
    get:
      tags: [Accounts]
      operationId: listFixedPriceOffers_accounts
      summary: List your accounts listings
      description: |
        Yours in this category, in any status. The seller is the key's own
        account — there is no parameter to read someone else's.
      parameters:
        - name: status
          in: query
          description: Comma-separated. A status nothing matches is an empty list, not an error.
          schema: { type: string, examples: ["active,draft"] }
        - name: game
          in: query
          description: Narrow to one game, by slug.
          schema: { type: string }
        - name: q
          in: query
          description: Narrow by title.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/FixedPriceRow" }
                  counts:
                    type: object
                    description: How many of your listings sit in each status.
                    additionalProperties: { type: integer }
                  facets:
                    type: object
                    description: The games you actually have listings in.
                  total: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/offers/accounts/{id}:
    get:
      tags: [Accounts]
      operationId: getFixedPriceOffer_accounts
      summary: Get one of your accounts listings
      description: |
        Any status, including what is left of its stock. A listing filed under
        another category answers `404`, like one that is not yours.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedPriceOfferDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Accounts]
      operationId: updateFixedPriceOffer_accounts
      summary: Edit one of your accounts listings
      description: |
        Every field is optional and means "leave this alone" when absent.
        Sending `images` or `tags` replaces the whole list rather than adding
        to it.

        Editing leaves the listing where it stands: an `active` one stays
        live, a `draft` stays a draft.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixedPriceUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedPriceOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Accounts]
      operationId: archiveFixedPriceOffer_accounts
      summary: Delete one of your accounts listings
      description: |
        Retires the listing for good — it leaves the marketplace, stays
        readable to you, and cannot be brought back. To take it down
        temporarily, unpublish it instead.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedPriceOffer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/accounts/{id}/publish:
    post:
      tags: [Accounts]
      operationId: publishFixedPriceOffer_accounts
      summary: Publish one of your accounts draft listings
      description: |
        Puts a `draft` on the marketplace. Buyers can see and buy it the moment
        this returns — nothing reviews it first.

        A listing with nothing left to sell is refused with `409`: add stock
        first.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedPriceOffer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/accounts/{id}/unpublish:
    post:
      tags: [Accounts]
      operationId: unpublishFixedPriceOffer_accounts
      summary: Unpublish one of your accounts listings
      description: Back to `draft`. Buyers stop seeing the listing; `publish` puts it back.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedPriceOffer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/accounts/{id}/units:
    post:
      tags: [Accounts]
      operationId: restockFixedPriceOffer_accounts
      summary: Restock one of your accounts listings
      description: |
        Adds units to the pool. Each entry is your own JSON — a login, a code,
        whatever the goods are. It is encrypted at rest and never read back by
        this API; only the buyer receives it, after the sale.

        Instant delivery only. This call is not idempotent: a retry adds the
        units again.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: array
                  minItems: 1
                  items: { type: object, description: Opaque to the platform. }
            examples:
              codes:
                value: { units: [{ code: "AAAA-BBBB" }, { code: "CCCC-DDDD" }] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: array
                    items: { $ref: "#/components/schemas/Unit" }
        "400":
          description: The listing is not instant (`not_instant_delivery`), or the body is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/offers/accounts/{id}/units/{unit_id}:
    delete:
      tags: [Accounts]
      operationId: removeUnitFixedPrice_accounts
      summary: Remove an unsold unit
      description: |
        Only while the unit is still available. Removing the last available
        one leaves the listing with no stock, which takes it off the
        marketplace until you restock.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
        - name: unit_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The unit is reserved or already sold (`unit_not_deletable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/offers/top-ups:
    post:
      tags: [Top-ups]
      operationId: createTopUpOffer_top_up
      summary: Create a top-up pack listing
      description: |
        Created as a `draft` — nobody but you can see it until you publish it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopUpCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUpOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/offers/top-ups/my:
    get:
      tags: [Top-ups]
      operationId: listTopUpOffers_top_up
      summary: List your top-up listings
      description: |
        Yours in this category, in any status. The seller is the key's own
        account — there is no parameter to read someone else's.
      parameters:
        - name: status
          in: query
          description: Comma-separated. A status nothing matches is an empty list, not an error.
          schema: { type: string, examples: ["active,draft"] }
        - name: game
          in: query
          description: Narrow to one game, by slug.
          schema: { type: string }
        - name: q
          in: query
          description: Narrow by title.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/TopUpRow" }
                  counts:
                    type: object
                    description: How many of your listings sit in each status.
                    additionalProperties: { type: integer }
                  facets:
                    type: object
                    description: The games you actually have listings in.
                  total: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/offers/top-ups/{id}:
    get:
      tags: [Top-ups]
      operationId: getTopUpOffer_top_up
      summary: Get one of your top-up listings
      description: |
        Any status, including what is left of its stock. A listing filed under
        another category answers `404`, like one that is not yours.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUpOfferDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Top-ups]
      operationId: updateTopUpOffer_top_up
      summary: Edit one of your top-up listings
      description: |
        Every field is optional and means "leave this alone" when absent.
        Sending `images` or `tags` replaces the whole list rather than adding
        to it.

        Editing leaves the listing where it stands: an `active` one stays
        live, a `draft` stays a draft.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopUpUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUpOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Top-ups]
      operationId: archiveTopUpOffer_top_up
      summary: Delete one of your top-up listings
      description: |
        Retires the listing for good — it leaves the marketplace, stays
        readable to you, and cannot be brought back. To take it down
        temporarily, unpublish it instead.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUpOffer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/top-ups/{id}/publish:
    post:
      tags: [Top-ups]
      operationId: publishTopUpOffer_top_up
      summary: Publish one of your top-up draft listings
      description: |
        Puts a `draft` on the marketplace. Buyers can see and buy it the moment
        this returns — nothing reviews it first.

        A listing with nothing left to sell is refused with `409`: add stock
        first.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUpOffer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/top-ups/{id}/unpublish:
    post:
      tags: [Top-ups]
      operationId: unpublishTopUpOffer_top_up
      summary: Unpublish one of your top-up listings
      description: Back to `draft`. Buyers stop seeing the listing; `publish` puts it back.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUpOffer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/top-ups/{id}/units:
    post:
      tags: [Top-ups]
      operationId: restockTopUpOffer_top_up
      summary: Restock one of your top-up listings
      description: |
        Adds units to the pool. Each entry is your own JSON — a login, a code,
        whatever the goods are. It is encrypted at rest and never read back by
        this API; only the buyer receives it, after the sale.

        Instant delivery only. This call is not idempotent: a retry adds the
        units again.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: array
                  minItems: 1
                  items: { type: object, description: Opaque to the platform. }
            examples:
              codes:
                value: { units: [{ code: "AAAA-BBBB" }, { code: "CCCC-DDDD" }] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: array
                    items: { $ref: "#/components/schemas/Unit" }
        "400":
          description: The listing is not instant (`not_instant_delivery`), or the body is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/offers/top-ups/{id}/units/{unit_id}:
    delete:
      tags: [Top-ups]
      operationId: removeUnitTopUp_top_up
      summary: Remove an unsold unit
      description: |
        Only while the unit is still available. Removing the last available
        one leaves the listing with no stock, which takes it off the
        marketplace until you restock.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
        - name: unit_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The unit is reserved or already sold (`unit_not_deletable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/offers/gift-cards:
    post:
      tags: [Gift cards]
      operationId: createGiftCardOffer_gift_card
      summary: Create a gift card listing
      description: |
        Created as a `draft` — nobody but you can see it until you publish it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftCardCreate" }
