      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/GiftCardRow" }
                  counts:
                    type: object
                    description: How many of your listings sit in each status.
                    additionalProperties: { type: integer }
                  facets:
                    type: object
                    description: The games you actually have listings in.
                  total: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/offers/gift-cards/{id}:
    get:
      tags: [Gift cards]
      operationId: getGiftCardOffer_gift_card
      summary: Get one of your gift-card listings
      description: |
        Any status, including what is left of its stock. A listing filed under
        another category answers `404`, like one that is not yours.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCardOfferDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Gift cards]
      operationId: updateGiftCardOffer_gift_card
      summary: Edit one of your gift-card listings
      description: |
        Every field is optional and means "leave this alone" when absent.
        Sending `images` or `tags` replaces the whole list rather than adding
        to it.

        Editing leaves the listing where it stands: an `active` one stays
        live, a `draft` stays a draft.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftCardUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCardOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Gift cards]
      operationId: archiveGiftCardOffer_gift_card
      summary: Delete one of your gift-card listings
      description: |
        Retires the listing for good — it leaves the marketplace, stays
        readable to you, and cannot be brought back. To take it down
        temporarily, unpublish it instead.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200":
