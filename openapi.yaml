        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/offers/gift-cards/{id}/units:
    post:
      tags: [Gift cards]
      operationId: restockGiftCardOffer_gift_card
      summary: Restock one of your gift-card listings
      description: |
        Adds units to the pool. Each entry is your own JSON — a login, a code,
        whatever the goods are. It is encrypted at rest and never read back by
        this API; only the buyer receives it, after the sale.

        Instant delivery only. This call is not idempotent: a retry adds the
        units again.
      parameters:
        - { $ref: "#/components/parameters/OfferID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [units]
              properties:
                units:
                  type: array
                  minItems: 1
                  items: { type: object, description: Opaque to the platform. }
            examples:
              codes:
                value: { units: [{ code: "AAAA-BBBB" }, { code: "CCCC-DDDD" }] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: array
                    items: { $ref: "#/components/schemas/Unit" }
        "400":
          description: The listing is not instant (`not_instant_delivery`), or the body is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/offers/gift-cards/{id}/units/{unit_id}:
    delete:
